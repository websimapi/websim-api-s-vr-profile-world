<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>@api's VR Profile World</title>
    <meta name="description" content="Explore @api's projects in an infinite 3D VR world">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/supermedium/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://mixedreality.mozilla.org/ammo.js/builds/ammo.wasm.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        
        #ui-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            max-width: 300px;
        }
        
        #project-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            display: none;
            border: 2px solid #00ffff;
        }
        
        #project-modal button {
            background: #00ffff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            color: black;
            font-weight: bold;
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1500;
            color: white;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <h3>@api's VR World</h3>
        <p>🎮 Use controllers or WASD to move</p>
        <p>🎯 Point and click to teleport</p>
        <p>✋ Grab artifacts to view projects</p>
        <p id="chunk-info">Chunk: 0,0</p>
        <p id="project-count">Projects loaded: 0</p>
    </div>
    
    <div id="loading">Loading @api's projects...</div>
    
    <div id="project-modal">
        <h2 id="modal-title"></h2>
        <p id="modal-description"></p>
        <div id="modal-stats"></div>
        <button onclick="openProject()">Open Project</button>
        <button onclick="closeModal()">Close</button>
    </div>

    <a-scene 
        background="color: #001122"
        fog="type: exponential; color: #001122; density: 0.0025"
        vr-mode-ui="enabled: true"
        device-orientation-permission-ui="enabled: true"
        loading-screen="enabled: false"
        embedded>
        
        <!-- Assets -->
        <a-assets>
            <a-mixin id="chunk-floor" 
                geometry="primitive: plane; width: 50; height: 50" 
                material="color: #112233; roughness: 0.8; metalness: 0.1">
            </a-mixin>
            
            <a-mixin id="artifact-base"
                geometry="primitive: box; width: 1; height: 1.5; depth: 1"
                material="color: #00ffff; roughness: 0.3; metalness: 0.7; emissive: #004444"
                animation__hover="property: rotation; to: 0 360 0; loop: true; dur: 10000">
            </a-mixin>
            
            <a-mixin id="teleport-area"
                geometry="primitive: cylinder; radius: 1; height: 0.1"
                material="color: #00ff00; opacity: 0.7; transparent: true"
                visible="false">
            </a-mixin>
        </a-assets>

        <!-- Lighting -->
        <a-light type="ambient" color="#404040" intensity="0.4"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.8" position="10 20 10"></a-light>
        <a-light type="point" color="#00ffff" intensity="0.5" position="0 5 0"></a-light>

        <!-- VR Camera Rig -->
        <a-entity id="rig" 
            position="0 1.6 3">
            
            <!-- Camera -->
            <a-camera id="camera"
                cursor="rayOrigin: mouse; fuse: false"
                raycaster="objects: .clickable; far: 50">
            </a-camera>
            
            <!-- VR Controllers -->
            <a-entity id="leftHand" 
                visible="false">
            </a-entity>
            
            <a-entity id="rightHand" 
                visible="false">
            </a-entity>
        </a-entity>

        <!-- World chunks container -->
        <a-entity id="world"></a-entity>
        
        <!-- Skybox -->
        <a-sky color="#000814" material="shader: gradient; topColor: #001122; bottomColor: #000408"></a-sky>
    </a-scene>

    <script>
        // Global variables
        let userProjects = [];
        let loadedChunks = new Set();
        let currentChunk = {x: 0, z: 0};
        let selectedProject = null;
        let scene;
        
        // Chunk management
        const CHUNK_SIZE = 50;
        const RENDER_DISTANCE = 2;
        
        class VRProfileWorld {
            constructor() {
                this.camera = document.querySelector('#camera');
                this.world = document.querySelector('#world');
                this.loadingEl = document.querySelector('#loading');
                this.rig = document.querySelector('#rig');
                this.scene = document.querySelector('a-scene');
                this.init();
            }
            
            async init() {
                console.log('Initializing VR Profile World...');
                
                try {
                    // Wait for A-Frame to be ready
                    await this.waitForScene();
                    
                    // Load projects first
                    await this.loadUserProjects();
                    
                    // Setup basic interactions
                    this.setupEventListeners();
                    
                    // Generate world
                    this.generateInitialChunks();
                    
                    // Setup movement controls
                    this.setupMovementControls();
                    
                    // Start update loop
                    this.startWorldLoop();
                    
                    // Hide loading screen
                    this.loadingEl.style.display = 'none';
                    
                    console.log('VR Profile World initialized successfully');
                    
                } catch (error) {
                    console.error('Failed to initialize VR world:', error);
                    this.handleInitError();
                }
            }
            
            waitForScene() {
                return new Promise((resolve) => {
                    if (this.scene.hasLoaded) {
                        resolve();
                    } else {
                        this.scene.addEventListener('loaded', resolve);
                    }
                });
            }
            
            setupMovementControls() {
                // Simple WASD movement using direct position manipulation
                document.addEventListener('keydown', (event) => {
                    const position = this.rig.getAttribute('position');
                    const rotation = this.camera.getAttribute('rotation');
                    const speed = 0.5;
                    
                    // Convert rotation to radians for movement direction
                    const yaw = (rotation.y * Math.PI) / 180;
                    
                    switch(event.key.toLowerCase()) {
                        case 'w':
                            position.x -= Math.sin(yaw) * speed;
                            position.z -= Math.cos(yaw) * speed;
                            break;
                        case 's':
                            position.x += Math.sin(yaw) * speed;
                            position.z += Math.cos(yaw) * speed;
                            break;
                        case 'a':
                            position.x -= Math.cos(yaw) * speed;
                            position.z += Math.sin(yaw) * speed;
                            break;
                        case 'd':
                            position.x += Math.cos(yaw) * speed;
                            position.z -= Math.sin(yaw) * speed;
                            break;
                    }
                    
                    this.rig.setAttribute('position', position);
                });
                
                // Add basic mouse look controls
                this.camera.setAttribute('look-controls', {
                    enabled: true,
                    pointerLockEnabled: true
                });
            }
            
            async loadUserProjects() {
                try {
                    const creator = await window.websim.getCreator();
                    if (!creator || creator.username !== 'api') {
                        throw new Error('Creator not found or not @api');
                    }
                    
                    const response = await fetch(`/api/v1/users/api/projects?posted=true&has_site=true&limit=50`);
                    if (!response.ok) throw new Error('Failed to fetch projects');
                    
                    const data = await response.json();
                    userProjects = data.projects.data.map(item => ({
                        id: item.project.id,
                        title: item.project.title || 'Untitled Project',
                        description: item.project.description || 'No description available',
                        stats: item.project.stats,
                        site: item.site,
                        updated_at: item.project.updated_at
                    }));
                    
                    document.querySelector('#project-count').textContent = `Projects loaded: ${userProjects.length}`;
                    console.log(`Loaded ${userProjects.length} projects`);
                    
                } catch (error) {
                    console.error('Error loading projects:', error);
                    this.createDemoProjects();
                }
            }
            
            createDemoProjects() {
                userProjects = [
                    {
                        id: 'demo1',
                        title: '3D Solar System',
                        description: 'Interactive 3D solar system with realistic planetary motion',
                        stats: {views: 1250, likes: 89, comments: 23}
                    },
                    {
                        id: 'demo2', 
                        title: 'Neural Network Visualizer',
                        description: 'Real-time visualization of neural network training',
                        stats: {views: 890, likes: 67, comments: 15}
                    },
                    {
                        id: 'demo3',
                        title: 'Quantum Physics Simulator',
                        description: 'Interactive quantum mechanics visualization tool',
                        stats: {views: 2100, likes: 156, comments: 42}
                    },
                    {
                        id: 'demo4',
                        title: 'Fractal Explorer',
                        description: 'Deep dive into mathematical fractals',
                        stats: {views: 756, likes: 43, comments: 8}
                    },
                    {
                        id: 'demo5',
                        title: 'Physics Playground',
                        description: 'Interactive physics simulation',
                        stats: {views: 1450, likes: 92, comments: 28}
                    }
                ];
                document.querySelector('#project-count').textContent = `Projects loaded: ${userProjects.length} (Demo Mode)`;
            }
            
            setupEventListeners() {
                // Click interaction for artifacts
                this.scene.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target && target.classList.contains('artifact')) {
                        this.selectArtifact(target);
                    }
                });
                
                // Cursor interaction
                this.camera.addEventListener('click', (event) => {
                    const intersectedEl = event.detail.intersectedEl;
                    if (intersectedEl && intersectedEl.classList.contains('artifact')) {
                        this.selectArtifact(intersectedEl);
                    }
                });
            }
            
            generateInitialChunks() {
                console.log('Generating initial chunks...');
                for (let x = -RENDER_DISTANCE; x <= RENDER_DISTANCE; x++) {
                    for (let z = -RENDER_DISTANCE; z <= RENDER_DISTANCE; z++) {
                        this.generateChunk(x, z);
                    }
                }
                console.log(`Generated ${(RENDER_DISTANCE * 2 + 1) ** 2} initial chunks`);
            }
            
            generateChunk(chunkX, chunkZ) {
                const chunkKey = `${chunkX},${chunkZ}`;
                if (loadedChunks.has(chunkKey)) return;
                
                loadedChunks.add(chunkKey);
                
                const chunkEntity = document.createElement('a-entity');
                chunkEntity.setAttribute('id', `chunk-${chunkKey}`);
                chunkEntity.setAttribute('position', `${chunkX * CHUNK_SIZE} 0 ${chunkZ * CHUNK_SIZE}`);
                
                // Create floor
                const floor = document.createElement('a-plane');
                floor.setAttribute('width', '50');
                floor.setAttribute('height', '50');
                floor.setAttribute('rotation', '-90 0 0');
                floor.setAttribute('position', '0 -0.1 0');
                floor.setAttribute('material', 'color: #112233; roughness: 0.8');
                chunkEntity.appendChild(floor);
                
                // Add artifacts (projects)
                this.populateChunkWithArtifacts(chunkEntity, chunkX, chunkZ);
                
                this.world.appendChild(chunkEntity);
            }
            
            populateChunkWithArtifacts(chunkEntity, chunkX, chunkZ) {
                if (userProjects.length === 0) return;
                
                const artifactCount = Math.floor(Math.random() * 5) + 3; // 3-7 artifacts per chunk
                
                for (let i = 0; i < artifactCount; i++) {
                    const project = userProjects[Math.floor(Math.random() * userProjects.length)];
                    
                    const artifact = document.createElement('a-box');
                    artifact.setAttribute('class', 'artifact clickable');
                    artifact.setAttribute('width', '1');
                    artifact.setAttribute('height', '1.5');
                    artifact.setAttribute('depth', '1');
                    artifact.setAttribute('material', 'color: #00ffff; roughness: 0.3; metalness: 0.7; emissive: #004444');
                    
                    // Random position within chunk
                    const x = (Math.random() - 0.5) * 40;
                    const z = (Math.random() - 0.5) * 40;
                    const y = 0.75;
                    artifact.setAttribute('position', `${x} ${y} ${z}`);
                    
                    // Add rotation animation
                    artifact.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 10000');
                    
                    // Store project data
                    artifact.projectData = project;
                    
                    // Add text label
                    const label = document.createElement('a-text');
                    label.setAttribute('value', project.title);
                    label.setAttribute('position', '0 1 0');
                    label.setAttribute('align', 'center');
                    label.setAttribute('color', '#ffffff');
                    label.setAttribute('scale', '1.5 1.5 1.5');
                    artifact.appendChild(label);
                    
                    chunkEntity.appendChild(artifact);
                }
            }
            
            selectArtifact(artifactEl) {
                if (!artifactEl.projectData) return;
                
                selectedProject = artifactEl.projectData;
                
                document.querySelector('#modal-title').textContent = selectedProject.title;
                document.querySelector('#modal-description').textContent = selectedProject.description;
                
                const statsEl = document.querySelector('#modal-stats');
                if (selectedProject.stats) {
                    statsEl.innerHTML = `
                        <p>👁️ Views: ${selectedProject.stats.views}</p>
                        <p>❤️ Likes: ${selectedProject.stats.likes}</p>
                        <p>💬 Comments: ${selectedProject.stats.comments}</p>
                    `;
                } else {
                    statsEl.innerHTML = '<p>Demo project - no stats available</p>';
                }
                
                document.querySelector('#project-modal').style.display = 'block';
                
                // Highlight selected artifact
                artifactEl.setAttribute('material', 'color: #ffff00; emissive: #444400');
                setTimeout(() => {
                    artifactEl.setAttribute('material', 'color: #00ffff; emissive: #004444');
                }, 1000);
            }
            
            startWorldLoop() {
                setInterval(() => {
                    this.updateChunks();
                }, 1000);
            }
            
            updateChunks() {
                const rigPos = this.rig.getAttribute('position');
                const newChunkX = Math.floor(rigPos.x / CHUNK_SIZE);
                const newChunkZ = Math.floor(rigPos.z / CHUNK_SIZE);
                
                if (newChunkX !== currentChunk.x || newChunkZ !== currentChunk.z) {
                    currentChunk = {x: newChunkX, z: newChunkZ};
                    document.querySelector('#chunk-info').textContent = `Chunk: ${newChunkX},${newChunkZ}`;
                    
                    // Generate new chunks around camera
                    for (let x = newChunkX - RENDER_DISTANCE; x <= newChunkX + RENDER_DISTANCE; x++) {
                        for (let z = newChunkZ - RENDER_DISTANCE; z <= newChunkZ + RENDER_DISTANCE; z++) {
                            this.generateChunk(x, z);
                        }
                    }
                    
                    // Remove distant chunks
                    this.cullDistantChunks(newChunkX, newChunkZ);
                }
            }
            
            cullDistantChunks(centerX, centerZ) {
                const chunksToRemove = [];
                
                loadedChunks.forEach(chunkKey => {
                    const [x, z] = chunkKey.split(',').map(Number);
                    const distance = Math.max(Math.abs(x - centerX), Math.abs(z - centerZ));
                    
                    if (distance > RENDER_DISTANCE + 1) {
                        chunksToRemove.push({key: chunkKey, x, z});
                    }
                });
                
                chunksToRemove.forEach(chunk => {
                    loadedChunks.delete(chunk.key);
                    const chunkEl = document.querySelector(`#chunk-${chunk.key}`);
                    if (chunkEl) {
                        chunkEl.remove();
                    }
                });
            }
            
            handleInitError() {
                console.log('Falling back to demo mode...');
                this.createDemoProjects();
                this.setupEventListeners();
                this.generateInitialChunks();
                this.setupMovementControls();
                this.startWorldLoop();
                this.loadingEl.textContent = 'Loaded in Demo Mode';
                setTimeout(() => this.loadingEl.style.display = 'none', 2000);
            }
        }
        
        // Global functions for modal
        function openProject() {
            if (selectedProject && !selectedProject.id.startsWith('demo')) {
                window.open(`https://websim.com/p/${selectedProject.id}`, '_blank');
            } else {
                alert('This is a demo project. Real projects will open in @api\'s actual profile.');
            }
            closeModal();
        }
        
        function closeModal() {
            document.querySelector('#project-modal').style.display = 'none';
            selectedProject = null;
        }
        
        // Initialize when A-Frame is ready
        document.addEventListener('DOMContentLoaded', () => {
            // Wait for A-Frame scene to be ready
            const scene = document.querySelector('a-scene');
            if (scene.hasLoaded) {
                new VRProfileWorld();
            } else {
                scene.addEventListener('loaded', () => {
                    new VRProfileWorld();
                });
            }
        });
        
        // Handle VR mode changes
        document.querySelector('a-scene').addEventListener('enter-vr', () => {
            document.querySelector('#ui-overlay').style.display = 'none';
        });
        
        document.querySelector('a-scene').addEventListener('exit-vr', () => {
            document.querySelector('#ui-overlay').style.display = 'block';
        });
    </script>

</body>
